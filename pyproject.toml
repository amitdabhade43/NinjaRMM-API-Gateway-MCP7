[project]
name = "ninja-mcp"
version = "0.3.0"
description = "NinjaOne API v2 MCP gateway with a local OLMo + LangGraph agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NinjaRMM-API-Gateway-MCP7 contributors" }]
dependencies = [
    "mcp>=1.3.0",
    "httpx>=0.28.0",
    "rapidfuzz>=3.6",
    "pydantic>=2.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.22",
]

[project.scripts]
ninja-mcp = "ninja_mcp.__main__:main"
ninjaone-agent = "ninjaone_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ninja_mcp", "src/ninjaone_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
